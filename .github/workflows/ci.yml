name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-check:
    name: Web Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Workspace Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lab_saathi"
          NEXT_TELEMETRY_DISABLED: "1"

  api-check:
    name: API Syntax & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Verify API compilation
        run: python -m py_compile apps/api/main.py
